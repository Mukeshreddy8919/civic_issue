spring.application.name=smartcity

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/civicpulse?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=mukesh

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=CivicPulseSecretKey_MustBeAtLeast64CharactersLongForHS512Algorithms!!
jwt.expirationMs=86400000

# Server
server.port=9090

# Security debug (remove after testing)
logging.level.org.springframework.security=DEBUG
