<div class="register-container">
  <div class="glass-card">
    <div class="header">
      <div class="logo">
        <span class="praise">Civic</span><span class="hub">Pulse</span>
      </div>
      <h2>Join Us</h2>
      <p>Create an account to pulse your voice</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" formControlName="username" placeholder="Choose a username">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" formControlName="email" placeholder="Enter your email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" formControlName="password" placeholder="Create a password">
        </div>
      </div>

      <div class="form-group">
        <label for="role">Sign up as</label>
        <div class="input-wrapper">
          <select id="role" formControlName="role">
            <option value="CITIZEN">Citizen</option>
            <option value="OFFICER">Officer</option>
          </select>
        </div>
      </div>

      <div *ngIf="error" class="error-msg">
        {{ error }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-primary">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="footer">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
