<div class="register-container">
  <div class="glass-card">
    <div class="header">
      <div class="logo">
        <span class="praise">Civic</span><span class="hub">Pulse</span>
      </div>
      <h2>Join Us</h2>
      <p>Create an account to pulse your voice</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" formControlName="username" placeholder="Choose a username">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" formControlName="email" placeholder="Enter your email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" formControlName="password" placeholder="Create a password">
        </div>
      </div>

        <div class="form-group">
          <label for="role">Sign up as</label>
          <div class="input-wrapper">
            <select id="role" formControlName="role">
              <option value="CITIZEN">Citizen</option>
              <option value="OFFICER">Officer</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
        </div>

        <!-- Officer Specific Fields -->
        <ng-container *ngIf="registerForm.get('role')?.value === 'OFFICER'">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <div class="input-wrapper">
              <input type="text" id="phone" formControlName="phone" placeholder="Enter phone number">
            </div>
          </div>

          <div class="form-group">
            <label for="department">Department</label>
            <div class="input-wrapper">
              <select id="department" formControlName="department">
                <option value="">Select Department</option>
                <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Work Location</label>
            <button type="button" class="btn-secondary" (click)="detectLocation()" [disabled]="locating">
              <span *ngIf="!locating">📍 Set Current Location</span>
              <span *ngIf="locating">Capturing...</span>
            </button>
            <p *ngIf="locationSuccess" class="success-text">Location captured! ({{registerForm.get('latitude')?.value | number:'1.2-2'}}, {{registerForm.get('longitude')?.value | number:'1.2-2'}})</p>
          </div>
        </ng-container>

      <div *ngIf="error" class="error-msg">
        {{ error }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-primary">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="footer">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
