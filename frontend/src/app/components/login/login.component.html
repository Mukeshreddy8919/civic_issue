<div class="login-container">
  <div class="glass-card">
    <div class="header">
      <div class="logo">
        <span class="praise">Civic</span><span class="hub">Pulse</span>
      </div>
      <h2>Welcome Back</h2>
      <p>Securely login to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="icon-user"></i>
          <input type="text" id="username" formControlName="username" placeholder="Enter your username" [class.error]="error">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="icon-lock"></i>
          <input type="password" id="password" formControlName="password" placeholder="Enter your password" [class.error]="error">
        </div>
      </div>

      <div *ngIf="error" class="error-msg">
        {{ error }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-primary">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="footer">
        Don't have an account? <a routerLink="/register">Register here</a>
      </div>
    </form>
  </div>
</div>
